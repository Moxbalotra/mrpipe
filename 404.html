<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#d66b0b">
  <meta name="description" content="Page not found. Return to the official MR PIPE website.">
  <title>404 | Page Not Found | MR PIPE</title>
  <link rel="icon" type="image/png" href="https://admin.mrpipe.in/assets/mrpipe-logo-DFT5y-I7.png">

  <style>
    :root{
      --orange:#d66b0b;
      --orange2:#f08b24;
      --black:#0b0e12;
      --muted:#8c96a2;
      --white:#fff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    body{
      color:var(--white);
      background:
        radial-gradient(circle at 50% 35%,rgba(214,107,11,.16),transparent 25%),
        radial-gradient(circle at 10% 90%,rgba(240,139,36,.08),transparent 25%),
        #080b0f;
      overflow:hidden;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:45px 45px;
      mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);
      pointer-events:none;
    }
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:relative;
      padding:30px 20px;
      text-align:center;
    }
    .logo{
      position:absolute;
      top:32px;
      left:40px;
      width:115px;
    }
    .logo img{
      width:100%;
      filter:drop-shadow(0 8px 20px rgba(214,107,11,.15));
    }
    .orbit{
      position:absolute;
      width:390px;
      height:390px;
      border:1px solid rgba(214,107,11,.14);
      border-radius:50%;
      animation:spin 20s linear infinite;
    }
    .orbit:before{
      content:"";
      position:absolute;
      width:8px;height:8px;
      border-radius:50%;
      background:var(--orange2);
      box-shadow:0 0 22px var(--orange2);
      top:50%;left:-4px;
    }
    .orbit.two{
      width:540px;height:540px;
      animation-duration:30s;
      animation-direction:reverse;
      border-color:rgba(255,255,255,.06);
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .content{position:relative;z-index:2;max-width:720px}
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border:1px solid rgba(240,139,36,.25);
      background:rgba(214,107,11,.08);
      border-radius:999px;
      color:#ffad5c;
      font-size:11px;
      font-weight:900;
      letter-spacing:.12em;
      margin-bottom:20px;
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--orange2);
      animation:pulse 1.7s infinite;
    }
    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 0 rgba(240,139,36,.5)}
      70%{box-shadow:0 0 0 9px rgba(240,139,36,0)}
    }
    .error{
      font-size:clamp(110px,22vw,220px);
      line-height:.78;
      letter-spacing:-.09em;
      font-weight:950;
      background:linear-gradient(135deg,#fff 10%,#fff 42%,#ef8a22 75%,#a94700);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:0 20px 60px rgba(214,107,11,.12);
      animation:float 4s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-8px)}
    }
    h1{
      font-size:clamp(27px,4vw,45px);
      letter-spacing:-.04em;
      margin:30px 0 12px;
    }
    p{
      color:var(--muted);
      font-size:16px;
      line-height:1.7;
      max-width:560px;
      margin:0 auto 28px;
    }
    .actions{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
    }
    .btn{
      min-height:50px;
      padding:0 22px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      border-radius:13px;
      font-size:14px;
      font-weight:850;
      text-decoration:none;
      transition:.22s ease;
    }
    .primary{
      color:#fff;
      background:linear-gradient(135deg,var(--orange),var(--orange2));
      box-shadow:0 12px 30px rgba(214,107,11,.24);
    }
    .primary:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(214,107,11,.32)}
    .secondary{
      color:#fff;
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.05);
      backdrop-filter:blur(10px);
    }
    .secondary:hover{transform:translateY(-3px);border-color:rgba(240,139,36,.5)}
    footer{
      position:absolute;
      bottom:24px;
      color:#66707c;
      font-size:12px;
    }
    footer a{color:#9da6b0;text-decoration:none;font-weight:700}
    footer a:hover{color:#ef8a22}
    @media(max-width:600px){
      .logo{left:22px;top:23px;width:95px}
      .orbit{width:290px;height:290px}
      .orbit.two{width:390px;height:390px}
      .error{font-size:125px}
      h1{margin-top:25px}
      p{font-size:14px}
      .actions{flex-direction:column;width:min(320px,100%);margin:auto}
      .btn{width:100%}
      footer{bottom:16px;padding:0 15px}
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="logo" href="/" aria-label="MR PIPE Home">
      <img src="https://admin.mrpipe.in/assets/mrpipe-logo-DFT5y-I7.png" alt="MR PIPE">
    </a>

    <div class="orbit"></div>
    <div class="orbit two"></div>

    <div class="content">
      <div class="badge"><span class="dot"></span> MR PIPE • PAGE NOT FOUND</div>

      <div class="error">404</div>

      <h1>Oops! This page took a wrong turn.</h1>

      <p>
        The page you are looking for doesn't exist, has been moved,
        or the URL may have been entered incorrectly.
        Let's get you back to MR PIPE.
      </p>

      <div class="actions">
        <a class="btn primary" href="/">⌂ Back to Home</a>
        <a class="btn secondary" href="https://maps.app.goo.gl/XvbfAhuHzphSPyiZ9" target="_blank" rel="noopener">📍 Find MR PIPE</a>
        <a class="btn secondary" href="tel:+917742550254">☎ Call Support</a>
      </div>
    </div>

    <footer>
      © <span id="year"></span> MR PIPE · Powered by
      <a href="https://www.morihix.com" target="_blank" rel="noopener">Morihix Pvt. Ltd.</a>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
